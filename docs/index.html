<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex">
<title>今日の予定</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
// 表示（自動・ライト・ダーク）。選んだものはこの端末に保存する（今日の画面と月間カレンダーで共通）。
// 自動は端末のライト／ダークに合わせる。描く前に決めて、白黒が一瞬入れ替わらないようにする
(function () {
  var KEY = 'jozenji-theme', mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
  function pref() { try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; } }
  function apply() {
    var p = pref(), t = p === 'auto' ? (mq && mq.matches ? 'light' : 'dark') : p, r = document.documentElement;
    var changed = r.getAttribute('data-theme') !== t;
    r.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#f4f5f7' : '#0f1115');
    if (changed) document.dispatchEvent(new Event('themechange'));
  }
  window.jzTheme = { pref: pref, apply: apply, set: function (p) { try { localStorage.setItem(KEY, p); } catch (e) {} apply(); } };
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply); }
  window.addEventListener('storage', function (e) { if (e.key === KEY) apply(); });   // 別のタブで変えたとき
  apply();
})();
</script>
<style>
:root{
  --bg:#0f1115; --card:#1a1d23; --line:#2a2e36; --text:#f3f4f6; --sub:#c9ccd1; --muted:#9aa0a8;
  --clinic-bg:#15241a; --clinic-text:#8ce99a; --warn:#ffa94d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));gap:10px}
body.night #app{opacity:.35}

/* 日付の数字と時計を同じ行（上の端）にそろえる。曜日・件数の行は日付の下 */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.date{display:flex;flex-direction:column;gap:2px}
.date b{font-size:34px;line-height:1;font-weight:700;letter-spacing:.01em}
.date span{font-size:14px;color:var(--sub)}
.clock{font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sub)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:13px;font-weight:700;border-radius:4px;padding:2px 8px}
.badge.clinic{background:var(--clinic-bg);color:var(--clinic-text);border:1px solid #2f5d3a}
.badge.warn{color:var(--warn);border:1px solid #5c3d1e}
/* 天気（気象庁の予報。今日と明日） */
.wx{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.wx:empty{display:none}
.wxd{background:var(--card);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wxd .top{display:flex;align-items:center;gap:8px;min-width:0}
.wxd .lb{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.wxd .ic{font-size:26px;line-height:1;white-space:nowrap}
.wxd .ic small{font-size:16px;margin-left:1px}
.wxd .tp{margin-left:auto;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wxd .tp .hi{color:#ff8a80}.wxd .tp .lo{color:#74c0fc}.wxd .tp i{font-style:normal;color:var(--muted);font-weight:400;margin:0 3px}
.wxd .tx{font-size:13px;color:var(--sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wxd .pp{display:flex;gap:12px;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.wxd .pp b{color:var(--text);font-weight:700;margin-left:3px}
.wxd .pp b.wet{color:#74c0fc}
.wxd .pp b.none{color:var(--muted);font-weight:400}
@media (max-width: 480px) {
  .wx{gap:6px}
  .wxd{padding:8px 10px}
  .wxd .ic{font-size:22px}
  .wxd .ic small{font-size:14px}
  .wxd .tp{font-size:17px}
  .wxd .tp i{margin:0 2px}
  .wxd .pp{gap:6px;font-size:12px}
  .wxd .pp b{margin-left:2px}
}
@media (max-width: 380px) {
  .wxd{padding:8px}
  .wxd .pp{gap:4px;font-size:11px}
  .wxd .pp b{margin-left:1px}
}

main{flex:1;min-height:0;position:relative;overflow:hidden}
.page{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;gap:8px;transition:opacity .4s}
.page.hidden{opacity:0;pointer-events:none}
.sec{font-size:13px;color:var(--muted);margin:4px 2px 0}

.card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:8px;padding:10px 12px;flex:none}
.card .t{width:62px;flex:none;display:flex;flex-direction:column;gap:2px}
.card .t b{font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.card .t span{font-size:12px;color:var(--muted)}
.card .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card .title{font-size:17px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.venue{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);min-width:0}
.venue span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.tag{font-size:11px;color:var(--muted);border:1px solid #3a3f48;border-radius:3px;padding:0 5px;flex:none;align-self:flex-start}
.card.past{opacity:.6}
.card.now{background:#16202c;outline:1px solid #2b4a6b}
.tag.now{color:#0f1115;background:#4dabf7;border-color:#4dabf7;font-weight:700}
.card.clinic{background:var(--clinic-bg);align-items:center}
.card.clinic .t b{color:var(--clinic-text);font-size:18px}


.compact .card{padding:7px 10px}
.compact .card .title{-webkit-line-clamp:1;font-size:16px}
.compact .card .t b{font-size:17px}
.compact .card .m{gap:3px}

.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub)}
.empty b{font-size:20px;color:var(--text)}


footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);gap:8px}
footer .fl{display:flex;flex-direction:column;gap:4px;min-width:0}
footer .fl #status{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cbtn{flex:none;font-size:14px;font-weight:700;color:var(--text);background:var(--card);border:1px solid var(--btn-line);
  border-radius:8px;height:44px;padding:0 14px;display:inline-flex;align-items:center;text-decoration:none}
.cbtn:focus-visible{outline:2px solid #4dabf7;outline-offset:2px}

.pager{display:flex;gap:5px}
.pager i{width:7px;height:7px;border-radius:50%;background:#3a3f48}
.pager i.on{background:var(--sub)}

/* 天気（今日・明日）と健診を1段に並べる。幅の狭いスマホでは縦に積む */
.top3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;flex:none}
.top3 .wx{gap:8px}
@media (max-width: 559px) { .top3{display:flex;flex-direction:column} }
/* 健診：「女性 午前のみ　男性 午前・午後」。緑＝午前・午後、黄＝午前のみ、灰＝休診（月間カレンダーと同じ色） */
.ctab{display:flex;align-items:center;gap:14px;background:var(--clinic-bg);border-radius:8px;padding:9px 14px;white-space:nowrap}
.ctab:empty{display:none}
.ctab .h{font-size:15px;font-weight:700;color:var(--clinic-text)}
.ctab .fs{display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;min-width:0}
.ctab .f{font-size:15px;color:var(--sub)}
.ctab .f b{margin-left:6px;font-weight:700}
.ctab .full{color:#6cc47e}.ctab .am{color:#e6b84c}.ctab .shut{color:#7d8784;font-weight:400}
/* タブレットでは天気の横の狭い欄なので、女性・男性を2行に */
@media (min-width: 560px) { .top3 .ctab{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
  .top3 .ctab .fs{flex-direction:column} .top3 .ctab .f{font-size:16px} }
/* 「今日」「これからの1週間」の見出し */
.sech{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--sub);flex:none;margin:2px 2px 0}
.sech::after{content:"";flex:1;height:1px;background:var(--line)}
.sech small{font-size:12px;font-weight:400;color:var(--muted)}
/* これからの1週間。今日の予定は中身の高さだけ取り、残りをこちらに使う */
main{flex:0 0 auto}
#ahead{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;margin-top:8px}
#ahead:empty{display:none}
.dayg{display:flex;flex-direction:column;gap:1px;flex:none}
.dayh{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;color:var(--sub);
  border-bottom:1px solid var(--line);padding:6px 4px 3px}
.dayh.sun{color:#ff8a80}.dayh.sat{color:#74c0fc}
.dayh .cl{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.arow{display:flex;align-items:center;gap:9px;padding:4px 4px;min-height:28px}
.arow .when{width:58px;flex:none;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.arow .name{flex:1;min-width:0;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.arow .vn{flex:none;max-width:34%;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.anone,.amore{font-size:13px;color:var(--muted);padding:3px 4px 3px 71px}
/* 横向きのタブレット・パソコン：左に今日、右にこれからの1週間 */
@media (orientation: landscape) and (min-height: 521px) {
  #app{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    grid-template-rows:auto auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"head ahead" "top3 ahead" "badges ahead" "todayh ahead" "main ahead" "foot foot";
    column-gap:22px;row-gap:10px}
  header{grid-area:head} .top3{grid-area:top3} #badges{grid-area:badges}
  #todayh{grid-area:todayh} main{grid-area:main;height:auto !important} footer{grid-area:foot}
  #ahead{grid-area:ahead;background:var(--card);border-radius:10px;padding:12px 16px;margin-top:0}
  .wxd{padding:8px 10px}
  .wxd .top{gap:5px}
  .wxd .ic{font-size:22px}
  .wxd .ic small{font-size:13px}
  .wxd .tp{font-size:17px}
  .wxd .pp{gap:6px;font-size:12px}
  .wxd .pp b{margin-left:2px}
  .ctab{padding:8px 12px}
  .dayh{font-size:16px;padding-top:8px}
  .dayh .cl{font-size:13px}
  .arow{min-height:32px}
  .arow .when{width:62px;font-size:14px}
  .arow .name{font-size:16px}
  .arow .vn{font-size:13px}
  .anone,.amore{padding-left:75px}
}
/* 横向き（スマホを横にして置いたとき）：左に日付・時計・天気・健診、右に今日とこれからの予定 */
@media (orientation: landscape) and (max-height: 520px) {
  #app{display:grid;grid-template-columns:236px minmax(0,1fr);
    grid-template-rows:auto auto auto 1fr auto;
    grid-template-areas:"head todayh" "top3 main" "top3 ahead" "badges ahead" "foot foot";
    column-gap:14px;row-gap:6px;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
  header{grid-area:head} .top3{grid-area:top3;display:flex;flex-direction:column;gap:6px;align-self:start}
  #badges{grid-area:badges} #todayh{grid-area:todayh} main{grid-area:main;align-self:start} footer{grid-area:foot}
  #ahead{grid-area:ahead;margin-top:0}
  /* 左の列は狭いので、天気は今日・明日を縦に並べ、天気の文は省く（絵・気温・降水確率だけ） */
  .top3 .wx{grid-template-columns:1fr;gap:4px}
  .wxd{padding:5px 10px;gap:2px}
  .wxd .top{gap:6px}
  .wxd .lb{font-size:12px}
  .wxd .ic{font-size:18px}
  .wxd .ic small{font-size:12px}
  .wxd .tp{font-size:15px}
  .wxd .tx{display:none}
  .wxd .pp{gap:8px;font-size:12px}
  .ctab{padding:5px 10px}
  .top3 .ctab{flex-direction:column;align-items:flex-start;gap:3px}
  .top3 .ctab .fs{flex-direction:column}
  .ctab .f{font-size:14px}
  .date b,.clock{font-size:30px}
  .date span{font-size:13px}
  .card .title{font-size:16px}
}
/* スマホ（縦・横とも）：1画面に収めず、縦にスクロールして今日とこれからの1週間を全部見せる。
   タブレット・パソコンは、つけっぱなしの掲示用に1画面に収める */
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  html,body{height:auto;overflow:visible}
  #app{height:auto;min-height:100vh;min-height:100dvh}
  main{height:auto !important;overflow:visible}
  .page{position:static}
  .empty{height:auto;padding:18px 0}
  #ahead{flex:none;overflow:visible;padding-bottom:8px}
  footer{position:sticky;bottom:0;z-index:2;background:var(--bg);padding:8px 0 max(4px,env(safe-area-inset-bottom));margin-top:auto}
}

/* ===== 白ベース（ライト） ===== */
:root{--btn-line:#3a3f48}
:root[data-theme="light"]{
  --bg:#f4f5f7; --card:#ffffff; --line:#dde1e6; --text:#1b1f24; --sub:#454b53; --muted:#6b727c;
  --clinic-bg:#e8f5ec; --clinic-text:#1f7a3a; --warn:#c25e00; --btn-line:#ccd1d7;
}
[data-theme="light"] body.night #app{opacity:1}
[data-theme="light"] .badge.clinic{border-color:#b9dfc2}
[data-theme="light"] .badge.warn{border-color:#f1c9a0;background:#fff6ec}
[data-theme="light"] .wxd,[data-theme="light"] .card,[data-theme="light"] .ctab{box-shadow:0 1px 2px rgba(0,0,0,.07)}
[data-theme="light"] .wxd .tp .hi{color:#d9480f}
[data-theme="light"] .wxd .tp .lo,[data-theme="light"] .wxd .pp b.wet{color:#1c7ed6}
[data-theme="light"] .tag,[data-theme="light"] .cbtn{border-color:var(--btn-line)}
[data-theme="light"] .card.now{background:#e8f2fd;outline-color:#a5c8ef}
[data-theme="light"] .tag.now{color:#fff;background:#1c7ed6;border-color:#1c7ed6}
[data-theme="light"] .pager i{background:#ccd1d7}
[data-theme="light"] .ctab .full{color:#2b8a3e}
[data-theme="light"] .ctab .am{color:#a86400}
[data-theme="light"] .ctab .shut{color:#868e96}
[data-theme="light"] .dayh.sun{color:#e03131}
[data-theme="light"] .dayh.sat{color:#1c7ed6}
[data-theme="light"] #ahead{box-shadow:0 1px 2px rgba(0,0,0,.07)}
/* スマホ：画面下の帯はボタンだけ。更新日時は1週間の一覧の下に出す */
.stline{display:none}
@media (max-width: 600px), (orientation: landscape) and (max-height: 520px) {
  footer .fl{display:none}
  .stline{display:block;font-size:11px;color:var(--muted);padding:10px 2px 4px;text-align:center}
}

/* 「◐ 表示」ボタンとメニュー */
.thm{position:relative;flex:none;display:flex}
.thbtn{font:inherit;font-size:14px;font-weight:700;color:var(--sub);background:var(--card);border:1px solid var(--btn-line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.thbtn:focus-visible,.thmenu button:focus-visible{outline:2px solid #4dabf7;outline-offset:2px}
.thmenu{position:absolute;right:0;bottom:calc(100% + 8px);min-width:210px;background:var(--card);border:1px solid var(--btn-line);border-radius:12px;
  padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:20}
.thmenu[hidden]{display:none}
.thmenu button{display:flex;align-items:center;gap:10px;font:inherit;font-size:15px;color:var(--text);background:none;border:0;border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.thmenu button .ck{width:16px;color:#1c7ed6;font-weight:700}
.thmenu button small{display:block;font-size:11px;color:var(--muted)}
.thmenu button.on{background:rgba(28,126,214,.14)}
[data-theme="light"] .thmenu{box-shadow:0 8px 24px rgba(0,0,0,.14)}
/* 白ベースの夜：白いまま薄くすると見づらいので、上から暗くかぶせる */
[data-theme="light"] body.night::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);pointer-events:none;z-index:50}

/* 画面下：左に「◐ 表示」、右に「月間 ›」（月間カレンダーの「‹ 今日」と同じ位置）。タブレットは真ん中に更新日時 */
footer .thm{order:-1}
footer .fl{flex:1;align-items:center}
footer .thmenu{left:0;right:auto}
/* これからの1週間：明日は今日に近い大きさ、明後日以降は小さく控えめに */
.dayg.tmr{margin-bottom:6px}
.dayg.tmr .dayh{font-size:16px;color:var(--text)}
.dayg.tmr .arow{min-height:34px}
.dayg.tmr .arow .when{font-size:15px;color:var(--text);font-weight:700}
.dayg.tmr .arow .name{font-size:17px;font-weight:700}
.dayg.tmr .arow .vn{font-size:13px}
.dayg:not(.tmr) .dayh{font-size:13px}
.dayg:not(.tmr) .arow{min-height:24px;padding:2px 4px}
.dayg:not(.tmr) .arow .when{font-size:12px;color:var(--muted)}
.dayg:not(.tmr) .arow .name{font-size:13px;color:var(--sub)}
.dayg:not(.tmr) .arow .vn{font-size:11px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="date"><b id="d">--/--</b><span id="w">読み込み中…</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div class="top3"><div class="wx" id="wx"></div><div class="ctab" id="clinic"></div></div>
  <div class="badges" id="badges"></div>
  <div class="sech" id="todayh">今日</div>
  <main id="main"></main>
  <div id="ahead"></div>
  <div class="stline" id="stline"></div>
  <footer>
    <div class="fl"><span class="pager" id="pager"></span><span id="status"></span></div>
    <div class="thm"><button class="thbtn" id="thbtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="thmenu">◐ 表示</button><div class="thmenu" id="thmenu" role="menu" aria-label="表示" hidden><button type="button" role="menuitemradio" data-v="auto"><span class="ck"></span><span>自動<small>端末の設定に合わせる</small></span></button><button type="button" role="menuitemradio" data-v="light"><span class="ck"></span><span>ライト</span></button><button type="button" role="menuitemradio" data-v="dark"><span class="ck"></span><span>ダーク</span></button></div></div>
    <a class="cbtn" id="calbtn" href="calendar.html">月間 ›</a>
  </footer>
</div>
<script>
(() => {
  'use strict';
  // ===== 設定 =====
  const DATA_URL = 'events.json';
  const REFETCH_MIN = 30;          // 予定を取り直す間隔（分）
  // スマホはスクロールで見せる（CSS の同じ条件と合わせる）
  const SCROLL_MQ = '(max-width: 600px), (orientation: landscape) and (max-height: 520px)';
  const PAGE_SEC = 12;             // 1画面に収まらないときの切り替え間隔（秒）
  const NIGHT = [23, 6];           // この時間帯は画面を暗くする（時）
  const DAILY_RELOAD_HOUR = 4;     // 毎日この時刻にページを読み直す（時）
  const CACHE_KEY = 'jozenji-events-v1';
  // 天気：気象庁の宮城県の予報。天気・降水確率は「東部」、気温は「仙台」
  const WX_URL = 'https://www.jma.go.jp/bosai/forecast/data/forecast/040000.json';
  const WX_AREA = '040010', WX_CITY = '34392';
  const WX_CACHE_KEY = 'jozenji-weather-v1';
  // 今日の最低気温は予報に無いので、仙台の観測（アメダス）の「0時から今までの最低」を使う。
  // 夕方（17時の発表）からは今日の最高も予報から消えるので、観測の「今日の最高」で補う
  const OBS_BASE = 'https://www.jma.go.jp/bosai/amedas/data/';
  const OBS_POINT = '34392';   // 仙台
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];

  // テスト用: ?now=2026-11-11T08:05 と ?data=xxx.json で時刻とデータを差し替えられる
  const qs = new URLSearchParams(location.search);
  const fixedNow = qs.get('now') ? new Date(qs.get('now') + '+09:00') : null;
  const dataUrl = qs.get('data') || DATA_URL;
  const wxUrl = qs.get('wx') || WX_URL;   // テスト用: ?wx=保存した予報.json
  const obsUrl = qs.get('obs');            // テスト用: ?obs=保存した観測.json
  // テスト用のパラメータは月間カレンダーへのリンクにも引き継ぐ
  if (fixedNow || qs.get('data')) document.getElementById('calbtn').href = 'calendar.html' + location.search;

  let data = null, lastFetchOk = null, fetchFailed = false, pageIdx = 0, pageTimer = null, lastKey = '';
  let wx = null;   // { published, days: { 'YYYY-MM-DD': { weather, code, pops:{'06':10,...}, popDay, max, min } } }
  let obs = null;  // { date: 'YYYY-MM-DD', at: 'YYYYMMDDhhmmss', max, min }  仙台の今日の観測

  // 端末の時刻設定に関係なく日本時間で扱う
  function nowJST() {
    const base = fixedNow ? fixedNow : new Date();
    const j = new Date(base.getTime() + 9 * 3600e3);
    return { y: j.getUTCFullYear(), mo: j.getUTCMonth() + 1, d: j.getUTCDate(), wd: j.getUTCDay(),
             h: j.getUTCHours(), mi: j.getUTCMinutes(), ms: base.getTime() };
  }
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  function addDays(isoDate, n) {
    const [y, m, d] = isoDate.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1, d + n));
    return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
  }
  const md = isoDate => { const [, m, d] = isoDate.split('-').map(Number); return `${m}/${d}`; };

  // "開場17:30 開演18:30" "9:30〜15:00" "①14:30 ②19:00 開演" などから表示用の時刻を取り出す
  function parseTime(s) {
    if (!s) return null;
    const times = [...s.matchAll(/(\d{1,2})[:：](\d{2})/g)].map(m => ({ h: +m[1], m: +m[2], i: m.index, len: m[0].length }));
    if (!times.length) return null;
    let main = times[0], label = '', end = null;
    const kaien = s.indexOf('開演');
    if (/開場/.test(s) && kaien >= 0) {
      const after = times.find(t => t.i > kaien) || times.filter(t => t.i < kaien).pop();
      if (after) main = after; label = '開演';
    } else if (kaien >= 0) label = '開演';
    // Rensa の「開場 / 開演」形式（例: 17:00 / 18:00）は後ろが開演
    const slash = s.match(/(\d{1,2})[:：](\d{2})\s*[\/／]\s*(\d{1,2})[:：](\d{2})/);
    if (slash && kaien < 0) { main = { h: +slash[3], m: +slash[4] }; label = '開演'; }
    const rng = s.match(/(\d{1,2})[:：](\d{2})\s*[〜~\-－ー]\s*(\d{1,2})[:：](\d{2})/);
    if (rng) { main = { h: +rng[1], m: +rng[2] }; end = { h: +rng[3], m: +rng[4] }; label = `〜${rng[3]}:${rng[4]}`; }
    const multi = (s.match(/[①②③④]/g) || []).length;
    if (multi > 1) label = `ほか${multi - 1}回`;
    if (/最終日/.test(s)) return null; // 会期ものの注記は時刻扱いしない
    return { h: main.h, m: main.m, end, label };
  }
  const mins = t => t.h * 60 + t.m;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function dot(color) { const d = el('span', 'dot'); d.style.background = color; return d; }

  function srcMap() {
    const m = {};
    for (const s of (data && data.sources) || []) m[s.id] = s;
    return m;
  }

  function classify(today, nowMin) {
    const S = srcMap();
    const evs = (data && data.events) || [];
    const clinic = [], timed = [], ongoing = [];
    for (const e of evs) {
      if (!(e.start <= today && today <= e.end)) continue;
      const src = S[e.s] || { color: '#adb5bd', kind: 'event', name: e.s };
      const item = { ...e, color: src.color, srcName: src.name };
      if (src.kind === 'clinic') {
        const ct = parseTime(e.time);
        item.past = !!(ct && ct.end && nowMin > mins(ct.end));
        clinic.push(item); continue;
      }
      const t = parseTime(e.time);
      if (e.start === e.end) {
        item.t = t;
        if (t) {
          // 終わりの時刻がないものは、始まってから2時間半で終わったとみなす
          const endMin = t.end ? mins(t.end) : mins(t) + 150;
          item.past = nowMin > endMin;
          item.now = !item.past && nowMin >= mins(t);
        }
        timed.push(item);
      } else {
        item.t = t;
        item.when = e.start === today ? '本日から' : e.end === today ? '本日まで' : `〜${md(e.end)}`;
        ongoing.push(item);
      }
    }
    timed.sort((a, b) => (a.t ? mins(a.t) : 9999) - (b.t ? mins(b.t) : 9999));
    ongoing.sort((a, b) => a.end.localeCompare(b.end));
    return { clinic, timed, ongoing };
  }

  function cardFor(item) {
    const c = el('div', 'card' + (item.past ? ' past' : '') + (item.now ? ' now' : ''));
    const t = el('div', 't');
    t.append(el('b', '', item.t ? `${item.t.h}:${pad(item.t.m)}` : '終日'));
    if (item.t && item.t.label) t.append(el('span', '', item.t.label));
    const m = el('div', 'm');
    m.append(el('div', 'title', item.title));
    const v = el('div', 'venue'); v.append(dot(item.color), el('span', '', item.venue || item.srcName));
    m.append(v);
    c.append(t, m);
    if (item.past) c.append(el('span', 'tag', '終了'));
    else if (item.now) c.append(el('span', 'tag now', '開催中'));
    return c;
  }
  function clinicCard(item) {
    const c = el('div', 'card clinic' + (item.past ? ' past' : ''));
    const t = el('div', 't'); t.append(el('b', '', '健診'));
    const m = el('div', 'm');
    const v = el('div', 'venue'); v.style.fontSize = '16px'; v.style.fontWeight = '700'; v.style.color = 'var(--text)';
    v.append(dot(item.color), el('span', '', item.title || item.srcName));
    m.append(v);
    if (item.time) m.append(el('div', 'venue', item.time));
    c.append(t, m);
    return c;
  }
  function rowFor(item) {
    const r = el('div', 'arow');
    r.append(el('span', 'when', item.t && item.t.end ? `${item.t.h}:${pad(item.t.m)}〜` : item.when), dot(item.color),
      el('span', 'name', item.title), el('span', 'vn', shortVenue(item.s, srcMap())));
    return r;
  }

  // 要素を高さに合わせてページに振り分ける
  function paginate(blocks) {
    const main = document.getElementById('main');
    main.textContent = '';
    main.classList.remove('compact');
    const H = main.clientHeight;
    const build = () => {
      main.textContent = '';
      const pages = []; let page = el('div', 'page'); main.append(page); let used = 0;
      for (const b of blocks) {
        page.append(b);
        const h = b.getBoundingClientRect().height + 8;
        if (used + h > H && page.children.length > 1) {
          page.removeChild(b);
          pages.push(page); page = el('div', 'page hidden'); main.append(page); page.append(b); used = h;
        } else used += h;
      }
      pages.push(page);
      return pages;
    };
    let pages = build();
    if (pages.length > 1) { main.classList.add('compact'); pages = build(); }
    // 「会期中」の見出しだけがページの最後に残ったら次のページへ送る
    for (let i = 0; i < pages.length - 1; i++) {
      const last = pages[i].lastElementChild;
      if (last && last.classList.contains('sec') && pages[i].children.length > 1) pages[i + 1].prepend(last);
    }
    return pages;
  }

  function showPage(pages) {
    clearInterval(pageTimer);
    const pager = document.getElementById('pager');
    pager.textContent = '';
    if (pages.length <= 1) return;
    pageIdx = Math.min(pageIdx, pages.length - 1);
    const paint = () => {
      pages.forEach((p, i) => p.classList.toggle('hidden', i !== pageIdx));
      [...pager.children].forEach((d, i) => d.classList.toggle('on', i === pageIdx));
    };
    pages.forEach(() => pager.append(el('i')));
    paint();
    pageTimer = setInterval(() => { pageIdx = (pageIdx + 1) % pages.length; paint(); }, PAGE_SEC * 1000);
  }

  function render(force) {
    const n = nowJST();
    const today = iso(n.y, n.mo, n.d);
    const nowMin = n.h * 60 + n.mi;
    document.getElementById('clock').textContent = `${n.h}:${pad(n.mi)}`;
    document.body.classList.toggle('night', NIGHT[0] > NIGHT[1] ? (n.h >= NIGHT[0] || n.h < NIGHT[1]) : (n.h >= NIGHT[0] && n.h < NIGHT[1]));
    // 中身は日付・分単位の状態が変わったときだけ作り直す
    const key = `${today}|${Math.floor(nowMin / 5)}|${data ? data.generated_at : ''}|${fetchFailed}|${wx ? wx.published : ''}|${obs ? obs.at : ''}`;
    if (!force && key === lastKey) return;
    lastKey = key;

    document.getElementById('d').textContent = `${n.mo}/${n.d}`;
    const { clinic, timed, ongoing } = classify(today, nowMin);
    const total = timed.length + ongoing.length;
    renderWx(today, n);
    renderClinic(today, n);
    document.getElementById('w').textContent = data ? `${WEEK[n.wd]}曜日 · 今日の予定 ${total}件` : `${WEEK[n.wd]}曜日`;

    const badges = document.getElementById('badges');
    badges.textContent = '';
    const stale = data && data.data_updated_at && (n.ms - Date.parse(data.data_updated_at)) > 10 * 864e5;
    if (!data) badges.append(el('span', 'badge warn', '予定を読み込めません'));
    else if (fetchFailed) badges.append(el('span', 'badge warn', 'オフライン（前回のデータ）'));
    else if (stale) badges.append(el('span', 'badge warn', 'データが古くなっています'));
    badges.style.display = badges.children.length ? '' : 'none';


    const blocks = [];
    clinic.forEach(c => blocks.push(clinicCard(c)));
    timed.forEach(t => blocks.push(cardFor(t)));
    if (ongoing.length) { blocks.push(el('div', 'sec', '会期中')); ongoing.forEach(o => blocks.push(rowFor(o))); }

    const main = document.getElementById('main');
    if (!blocks.length) {
      main.classList.remove('compact');
      main.textContent = '';
      const e = el('div', 'empty');
      if (data) e.append(el('b', '', '今日の予定はありません'));
      else if (fetchFailed) { e.append(el('b', '', '予定を読み込めません')); e.append(el('span', '', 'Wi-Fiの接続を確認してください')); }
      else e.append(el('b', '', '読み込み中…'));
      main.style.height = matchMedia('(orientation: landscape) and (min-height: 521px)').matches || matchMedia(SCROLL_MQ).matches ? '' : '72px';
      main.append(e);
      showPage([]);
    } else {
      const wide = matchMedia('(orientation: landscape) and (min-height: 521px)').matches;
      if (matchMedia(SCROLL_MQ).matches) {
        // スマホ：ページは分けず、全部並べてスクロールで見せる
        main.classList.remove('compact');
        main.style.height = '';
        main.textContent = '';
        const page = el('div', 'page');
        blocks.forEach(b => page.append(b));
        main.append(page);
        showPage([]);
      } else {
      if (!wide) {
        // 縦向き・スマホ：今日の予定は中身の高さだけ（多すぎるときは画面の半分まで。入りきらない分はページを切り替えて出す）
        main.style.height = 'auto';
        main.textContent = '';
        const probe = el('div', 'page'); probe.style.position = 'static';
        blocks.forEach(b => probe.append(b));
        main.append(probe);
        const need = probe.getBoundingClientRect().height + 2;
        main.textContent = '';
        main.style.height = Math.min(need + 10, window.innerHeight * 0.45) + 'px';
      }
      showPage(paginate(blocks));
      }
    }
    renderAhead(today);

    const st = document.getElementById('status');
    // 予定の更新日時と、天気の出典（気象庁）・発表時刻。天気の発表が今日なら日付は省く
    const parts = [];
    if (data && data.data_updated_at) parts.push(`予定 ${md(data.data_updated_at.slice(0, 10))} ${data.data_updated_at.slice(11, 16)}更新`);
    if (wx) parts.push(`天気 気象庁 ${wx.published.slice(0, 10) === today ? '' : md(wx.published.slice(0, 10)) + ' '}${+wx.published.slice(11, 13)}時発表`);
    st.textContent = parts.join(' · ');
    document.getElementById('stline').textContent = st.textContent;   // スマホは一覧の下に出す
  }

  // ===== 天気 =====
  // 気象庁の府県天気予報（JSON）を、日付ごとの天気・6時間ごとの降水確率・最高/最低気温に直す
  function parseWx(raw) {
    const days = {};
    const day = t => (days[t.slice(0, 10)] ||= {});
    const short = raw[0];
    for (const ts of short.timeSeries) {
      const td = ts.timeDefines;
      for (const a of ts.areas) {
        const c = a.area.code;
        if (c === WX_AREA && a.weathers) td.forEach((t, i) => Object.assign(day(t), {
          weather: a.weathers[i].replace(/\s+/g, ''), code: (a.weatherCodes || [])[i] || '' }));
        if (c === WX_AREA && a.pops) td.forEach((t, i) => {
          if (a.pops[i] !== '') (day(t).pops ||= {})[t.slice(11, 13)] = +a.pops[i]; });
        if (c === WX_CITY && a.temps) {
          // 1日に2つ並ぶ。09時が日中の最高、00時が朝の最低。
          // ただし最高のあとに並ぶ00時は、朝が過ぎて最低の予報がない日の埋め草（最高と同じ値）なので使わない
          const hasMax = {};
          td.forEach((t, i) => {
            const v = a.temps[i], d = t.slice(0, 10);
            if (v === '') return;
            if (t.slice(11, 13) === '00') { if (!hasMax[d]) day(t).min = +v; }
            else { day(t).max = +v; hasMax[d] = true; }
          });
        }
      }
    }
    // 週間予報で、足りないところ（明後日以降の気温や、1日の降水確率）を補う
    const week = raw[1];
    for (const ts of (week && week.timeSeries) || []) {
      const td = ts.timeDefines;
      for (const a of ts.areas) {
        const c = a.area.code;
        if (c === WX_CITY && a.tempsMax) td.forEach((t, i) => {
          const d = day(t);
          if (a.tempsMax[i] !== '' && d.max == null) d.max = +a.tempsMax[i];
          if (a.tempsMin[i] !== '' && d.min == null) d.min = +a.tempsMin[i];
        });
        if (c === WX_AREA && a.weatherCodes) td.forEach((t, i) => {
          const d = day(t);
          if (!d.code) d.code = a.weatherCodes[i];
          if (a.pops && a.pops[i] !== '' && d.popDay == null) d.popDay = +a.pops[i];
        });
      }
    }
    return { published: short.reportDatetime, days };
  }

  // 天気の絵。主な天気（コードの百の位）と、文にある「のち・時々」の天気を小さく添える
  function wxIcon(code, text) {
    const main = { '1': 'sun', '2': 'cloud', '3': 'rain', '4': 'snow' }[String(code)[0]] || '';
    const E = { sun: '☀️', cloud: '☁️', rain: '☔', snow: '⛄' };
    let sub = '';
    if (text) {
      if (main !== 'snow' && /雪/.test(text)) sub = 'snow';
      else if (main !== 'rain' && main !== 'snow' && /雨/.test(text)) sub = 'rain';
      else if (main === 'sun' && /くもり/.test(text)) sub = 'cloud';
      else if (main === 'cloud' && /晴/.test(text)) sub = 'sun';
    }
    return { main: E[main] || '', sub: E[sub] || '' };
  }

  function wxCell(label, d, today, n) {
    const c = el('div', 'wxd');
    const top = el('div', 'top');
    top.append(el('span', 'lb', label));
    const ic = wxIcon(d.code, d.weather);
    const icn = el('span', 'ic', ic.main);
    if (ic.sub) icn.append(el('small', '', ic.sub));
    top.append(icn);
    const tp = el('span', 'tp');
    if (d.obsNote) tp.title = d.obsNote;
    if (d.min == null) { const hi = el('span', 'hi'); hi.append(el('small', '', '最高 '), d.max != null ? `${d.max}°` : '−'); tp.append(hi); }
    else tp.append(el('span', 'hi', d.max != null ? `${d.max}°` : '−'), el('i', '', '/'), el('span', 'lo', `${d.min}°`));
    top.append(tp);
    c.append(top);
    if (d.weather) { const tx = el('div', 'tx', d.weather); tx.title = d.weather; c.append(tx); }
    const pp = el('div', 'pp');
    if (d.pops) {
      // 6〜12時を午前、12〜18時を午後、18〜24時を夜として出す。今日の過ぎた時間帯は「−」
      [['06', '午前'], ['12', '午後'], ['18', '夜']].forEach(([h, name]) => {
        const v = d.pops[h];
        const s = el('span', '', name);
        s.append(el('b', v == null ? 'none' : v >= 50 ? 'wet' : '', v == null ? '−' : `${v}%`));
        pp.append(s);
      });
    } else if (d.popDay != null) {
      const s = el('span', '', '降水');
      s.append(el('b', d.popDay >= 50 ? 'wet' : '', `${d.popDay}%`));
      pp.append(s);
    }
    if (pp.children.length) c.append(pp);
    return c;
  }

  function renderWx(today, n) {
    const box = document.getElementById('wx');
    box.textContent = '';
    if (!wx) return;
    const tomorrow = addDays(today, 1);
    let a = wx.days[today];
    const b = wx.days[tomorrow];
    if (!a && !b) return;   // 予報が古すぎる（今日・明日の分がない）ときは出さない
    if (a && obs && obs.date === today) {
      // 最高：予報があれば予報（ただし、もう予報より上がっていれば観測）。予報が消えた夕方以降は観測
      let max = a.max;
      if (obs.max != null) max = max == null ? Math.round(obs.max) : Math.max(max, Math.round(obs.max));
      // 最低：予報には無いので、観測の0時から今までの最低
      const min = a.min != null ? a.min : obs.min != null ? Math.round(obs.min) : null;
      a = Object.assign({}, a, { max, min,
        obsNote: `今日の最低は仙台の観測（0時から${+obs.at.slice(8, 10)}:${obs.at.slice(10, 12)}まで）` + (a.max == null ? '、最高も観測' : '') });
    }
    box.append(a ? wxCell('今日', a, today, n) : el('div'), b ? wxCell('明日', b, today, n) : el('div'));
  }

  async function loadWx() {
    try {
      const r = await fetch(wxUrl, { cache: 'no-cache' });
      if (!r.ok) throw new Error(r.status);
      wx = parseWx(await r.json());
      try { localStorage.setItem(WX_CACHE_KEY, JSON.stringify(wx)); } catch (_) {}
    } catch (err) {
      if (!wx) { try { const c = localStorage.getItem(WX_CACHE_KEY); if (c) wx = JSON.parse(c); } catch (_) {} }
    }
    await loadObs();
    render(true);
  }

  // 仙台の観測：最新の時刻を調べ、その時刻を含む3時間ごとのファイルの、いちばん新しい記録を読む
  async function loadObs() {
    try {
      let url = obsUrl;
      if (!url) {
        const t = (await (await fetch(OBS_BASE + 'latest_time.txt', { cache: 'no-cache' })).text()).trim();   // 例 2026-11-22T06:20:00+09:00
        const m = t.match(/^(\d{4})-(\d{2})-(\d{2})T(\d{2})/);
        if (!m) throw new Error('time');
        url = `${OBS_BASE}point/${OBS_POINT}/${m[1]}${m[2]}${m[3]}_${pad(Math.floor(+m[4] / 3) * 3)}.json`;
      }
      const r = await fetch(url, { cache: 'no-cache' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const k = Object.keys(d).sort().pop();
      // 0:00 ちょうどの記録の最高・最低は前の日の分なので使わない
      if (!k || k.slice(8, 12) === '0000') { obs = null; return; }
      const v = x => (Array.isArray(x) && x[0] != null && x[1] === 0) ? x[0] : null;   // [値, 品質]。品質0が正常
      obs = { date: `${k.slice(0, 4)}-${k.slice(4, 6)}-${k.slice(6, 8)}`, at: k, max: v(d[k].maxTemp), min: v(d[k].minTemp) };
    } catch (err) {
      // 読めなければ前に読んだ観測のまま。日付が今日でなければ使われない（今日の最低は出さず、最高は予報だけ）
    }
  }

  // 健診（一番町健診クリニック）の今日の状況を、女性・男性ごとに「午前・午後／午前のみ／休診」で出す
  // 土曜は午後が無いので、やっている日は「午前のみ」
  const clinicWord = (s, sat) => s === 'open' && !sat ? ['full', '午前・午後'] : (s === 'open' || s === 'pm_closed') ? ['am', '午前のみ'] : ['shut', '休診'];
  function renderClinic(today, n) {
    const box = document.getElementById('clinic');
    box.textContent = '';
    const c = data && data.clinic;
    const st = c && c.days && c.days[today];
    if (!st || !st.some(Boolean)) return;
    const sat = n.wd === 6;
    box.append(el('span', 'h', '健診'));
    const fs = el('span', 'fs');
    if (st.every(s => clinicWord(s, sat)[0] === 'shut')) fs.append(el('b', 'shut', '休診'));
    else st.forEach((s, i) => {
      const [cls, word] = clinicWord(s, sat);
      const f = el('span', 'f', (c.floors[i] || '').replace(/（.*/, ''));
      f.append(el('b', cls, word));
      fs.append(f);
    });
    box.append(fs);
  }

  // これからの1週間（明日〜6日後）。日ごとに、その日に始まる予定を並べる
  const CL_TEXT = { open: '午前・午後', pm_closed: '午前のみ', closed: '休診' };
  const SHORT = { rensa: 'Rensa', 'miyagi-hall': 'エレクトロンホール', mitsukoshi: '三越', kotodai: '勾当台公園' };
  const shortVenue = (sid, S) => SHORT[sid] || (S[sid] || {}).name || '';
  function renderAhead(today) {
    const box = document.getElementById('ahead');
    box.textContent = '';
    if (!data) return;
    const S = srcMap();
    const c = data.clinic;
    box.append(el('div', 'sech', 'これからの1週間'));
    const scroll = matchMedia(SCROLL_MQ).matches;   // スマホは高さを気にせず7日分すべて
    const fits = () => scroll || box.scrollHeight <= box.clientHeight + 1;
    for (let k = 1; k <= 7; k++) {
      const day = addDays(today, k);
      const [y, m, d] = day.split('-').map(Number);
      const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
      const g = el('div', 'dayg' + (k === 1 ? ' tmr' : ''));   // 明日は大きく、明後日以降は控えめに
      const hd = el('div', 'dayh' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : ''), `${k === 1 ? '明日 ' : ''}${m}/${d}（${WEEK[wd]}）`);
      const st = c && c.days && c.days[day];
      if (st && st.some(Boolean)) {
        const cl = el('span', 'cl');
        const parts = st.map((s, i) => `${(c.floors[i] || '').replace(/（.*/, '').replace('性', '')} ${s === 'pm_closed' || (s === 'open' && wd === 6) ? '午前のみ' : CL_TEXT[s] || '－'}`);
        cl.append(el('span', '', '健診 '), document.createTextNode(parts.join(' · ')));
        if (st.every(s => s === 'closed')) { cl.className = 'cl off'; cl.textContent = '健診 休診'; }
        hd.append(cl);
      }
      g.append(hd);
      const list = data.events.filter(e => e.start === day && (S[e.s] || {}).kind !== 'clinic')
        .map(e => ({ e, t: parseTime(e.time) }))
        .sort((a, b) => (a.t ? mins(a.t) : -1) - (b.t ? mins(b.t) : -1));
      if (!list.length) g.append(el('div', 'anone', '新しい予定なし'));
      const rows = list.map(({ e, t }) => {
        const r = el('div', 'arow');
        r.append(el('span', 'when', t ? `${t.h}:${pad(t.m)}` : e.end > e.start ? `〜${md(e.end)}` : '終日'),
          dot((S[e.s] || {}).color || '#adb5bd'), el('span', 'name', e.title), el('span', 'vn', shortVenue(e.s, S)));
        return r;
      });
      rows.forEach(r => g.append(r));
      box.append(g);
      if (!fits()) {
        // 入りきらない分は後ろから外して「ほか n 件」にまとめ、そこで終わる。見出しすら入らなければ、その日ごと出さない
        const left = [...g.querySelectorAll('.arow')];
        const more = el('div', 'amore');
        g.append(more);
        let hidden = 0;
        while (!fits() && left.length) { left.pop().remove(); more.textContent = `ほか ${++hidden} 件`; }
        if (!hidden) more.remove();
        if (!fits()) box.removeChild(g);
        break;
      }
    }
  }

  async function load() {
    try {
      const sep = dataUrl.includes('?') ? '&' : '?';
      const r = await fetch(`${dataUrl}${sep}t=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      if (!j || !Array.isArray(j.events)) throw new Error('bad data');
      data = j; fetchFailed = false; lastFetchOk = Date.now();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(j)); } catch (_) {}
    } catch (err) {
      fetchFailed = true;
      if (!data) { try { const c = localStorage.getItem(CACHE_KEY); if (c) data = JSON.parse(c); } catch (_) {} }
    }
    render(true);
  }

  // 画面が消えないようにする（対応していない環境では何もしない）
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); load(); loadWx(); } });

  // 毎日決まった時刻にページを読み直して、ページ自体の更新も取り込む
  const bootDay = nowJST().d;
  setInterval(() => {
    const n = nowJST();
    if (n.d !== bootDay && n.h === DAILY_RELOAD_HOUR && !fixedNow) location.reload();
  }, 60e3);

  setInterval(() => render(false), 15e3);
  setInterval(() => { load(); loadWx(); }, REFETCH_MIN * 60e3);
  window.addEventListener('resize', () => render(true));
  load(); loadWx(); keepAwake();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
<script>
// 「◐ 表示」のメニュー
(function () {
  var btn = document.getElementById('thbtn'), menu = document.getElementById('thmenu');
  if (!btn || !menu) return;
  function sync() {
    var p = window.jzTheme.pref();
    menu.querySelectorAll('[data-v]').forEach(function (b) {
      var on = b.getAttribute('data-v') === p;
      b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.querySelector('.ck').textContent = on ? '✓' : '';
    });
  }
  function open(v) { menu.hidden = !v; btn.setAttribute('aria-expanded', v ? 'true' : 'false'); if (v) sync(); }
  btn.addEventListener('click', function (e) { e.stopPropagation(); open(menu.hidden); });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('[data-v]'); if (!b) return;
    window.jzTheme.set(b.getAttribute('data-v')); sync(); open(false);
  });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) open(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') open(false); });
})();
</script>
</body>
</html>
