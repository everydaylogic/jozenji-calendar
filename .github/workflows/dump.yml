name: ページの保存（調査用）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python updater/dump.py
      - name: dump ブランチに保存
        run: |
          mkdir -p /tmp/out && cp -r dump /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dump
          git rm -rfq .
          cp -r /tmp/out/dump .
          git add dump
          git commit -qm "ページの保存（調査用）"
          git push -f origin dump
