name: 天気予報の更新

on:
  workflow_dispatch:
    inputs:
      raw:
        description: "気象庁のデータをそのまま記録に出す（確認用）"
        type: boolean
        default: false
  # 1時間おき。気象庁の発表（5時・11時・17時）が変わったときだけ保存する
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 確認用：気象庁の応答を見る
        if: inputs.raw
        run: |
          curl -sSI -H "Origin: https://everydaylogic.github.io" https://www.jma.go.jp/bosai/forecast/data/forecast/040000.json
          echo "----- RAW -----"
          curl -sS https://www.jma.go.jp/bosai/forecast/data/forecast/040000.json
          echo
          echo "----- END -----"

      - name: 天気予報を取る
        run: |
          pip install -q requests
          python updater/weather.py

      - name: 変わっていれば保存して公開する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add docs/weather.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -q -m "天気予報を更新"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
          fi
