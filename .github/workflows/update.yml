name: イベントデータの更新（試験）

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama のモデル"
        default: "qwen3:8b"
        required: true
      only:
        description: "一部のサイトだけ（カンマ区切り。空なら全部）例: mitsukoshi,morisanho"
        default: ""
        required: false
      test_notice:
        description: "連絡（Issue）のテスト"
        type: boolean
        default: false
  # 毎週日曜 6:48（日本時間）。Claude の定期更新（5:48）の後に動かして、結果を本番と見比べる
  schedule:
    - cron: "48 21 * * 6"

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # 本番（Claude）の更新をやめたら "off" にする。off にすると、本番の代わりに先週の自分と見比べる
      COMPARE_WITH_PROD: "on"
      OLLAMA_MODEL: ${{ inputs.model || 'qwen3:8b' }}
      OLLAMA_MODELS: ${{ github.workspace }}/../ollama-models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python の部品を入れる
        run: pip install -r requirements.txt

      - name: モデルのキャッシュ
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../ollama-models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Ollama を入れて起動する
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama --version

      - name: モデルを用意する
        run: |
          start=$(date +%s)
          ollama pull "$OLLAMA_MODEL"
          echo "モデルの用意: $(( $(date +%s) - start )) 秒" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: 更新する
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python updater/run.py --only "$ONLY"
          else
            python updater/run.py
          fi

      - name: 記録を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ollama.log
            data/last_run.md

      - name: 変わっていれば保存して公開する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data docs/events.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "events.json を更新（$(TZ=Asia/Tokyo date +%F)・試験）"
            # 天気予報の更新が途中で入っていることがあるので、取り込んでから送る
            for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 10; done
          fi

      - name: 問題があれば Issue で知らせる
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ inputs.test_notice }}" = "true" ]; then
            echo "- これは連絡のテストです。届いていれば、この Issue は閉じてください" >> problems.md
          fi
          if [ "$JOB_STATUS" != "success" ]; then
            printf -- "- 更新の処理そのものが途中で止まりました（%s）。今週のデータは更新されていません\n" "$JOB_STATUS" >> problems.md
          fi
          [ -s problems.md ] || { echo "問題なし"; exit 0; }
          {
            echo "@${{ github.repository_owner }} 控えの自動更新で問題がありました（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）。"
            echo
            cat problems.md
            echo
            echo "実行の記録：$RUN_URL"
            echo
            echo "直ったら、この Issue を閉じてください。閉じるまでは、次の問題もこの Issue に追記されます。"
          } > issue.md
          gh label create "更新の問題" --color d93f0b --description "控えの自動更新で問題があった" 2>/dev/null || true
          num=$(gh issue list --state open --label "更新の問題" --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file issue.md
          else
            gh issue create --title "控えの自動更新で問題がありました" --label "更新の問題" --body-file issue.md
          fi
