name: 確認用（あとで消す）
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=https://www.jma.go.jp/bosai/forecast/data/forecast/040000.json
          curl -sS $F | python3 -c "
          import json,sys; d=json.load(sys.stdin); s=d[0]; print('report', s['reportDatetime'])
          for ts in s['timeSeries']:
            for a in ts['areas']:
              if a['area']['code'] in ('34392',): print('temps', ts['timeDefines'], a)
          w=d[1]
          for ts in w['timeSeries']:
            for a in ts['areas']:
              if a['area']['code']=='34392': print('week', ts['timeDefines'][:3], {k:v[:3] for k,v in a.items() if k!='area'})
          "
          echo ----- amedas
          T=$(curl -sS https://www.jma.go.jp/bosai/amedas/data/latest_time.txt); echo latest $T
          D=$(TZ=Asia/Tokyo date +%Y%m%d); H=$(TZ=Asia/Tokyo date +%H); B=$(printf %02d $(( 10#$H / 3 * 3 )))
          U=https://www.jma.go.jp/bosai/amedas/data/point/34392/${D}_${B}.json
          echo $U
          curl -sSI -H "Origin: https://everydaylogic.github.io" $U | grep -i -E "HTTP/|access-control"
          curl -sS $U | python3 -c "
          import json,sys; d=json.load(sys.stdin); ks=sorted(d); print(len(ks), ks[0], ks[-1]); print(ks[-1], d[ks[-1]])"
          curl -sS https://www.jma.go.jp/bosai/amedas/const/amedastable.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('34392'))"
