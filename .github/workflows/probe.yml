name: 確認用（あとで消す）
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          cd updater && python - <<'PY'
          import sys; sys.path.insert(0,'.')
          from datetime import date
          import sites
          for today in (date.today(), date(2027,7,15)):
              ctx = sites.Ctx(today, {})
              f, n, p = sites.festivals(ctx)
              print('TODAY', today, '| found:', [(e['title'], e['date_start'], e['date_end']) for e in f], '| notes:', n, '| problems:', p)
          PY
