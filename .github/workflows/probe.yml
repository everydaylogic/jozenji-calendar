name: 確認用（あとで消す）
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for m in 0809 0805 0810 0801 0811; do
            echo "===== r$m"
            curl -s -A 'Mozilla/5.0' https://www.pref.miyagi.jp/site/event/kankouevent-r$m.html | python3 -c "
          import sys,re,html
          s=sys.stdin.read()
          t=re.sub(r'<(br|/p|/tr|/h\d|/caption|/th|/td)[^>]*>','\n',s); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(t)
          lines=[re.sub(r'\s+',' ',l).strip() for l in t.split('\n')]; lines=[l for l in lines if l]
          for i,l in enumerate(lines):
            if l.startswith('開催日'):
              title=lines[i-1] if not lines[i-1].startswith('★') else lines[i-2]
              venue=next((x for x in lines[i:i+8] if x.startswith('会場')),'')
              print('-',title[:40],'|',l[:40],'|',venue[:50])
          "
          done
          echo ===== structure sample
          curl -s -A 'Mozilla/5.0' https://www.pref.miyagi.jp/site/event/kankouevent-r0810.html | grep -n -E 'YOSAKOI' | head -3 | cut -c1-300
